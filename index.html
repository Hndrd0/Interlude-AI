<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interlude AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Mobile overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__logo">
        <span class="sidebar__logo-icon">✦</span>
        <span class="sidebar__logo-text">Interlude AI</span>
      </div>
      <button id="sidebar-close" class="sidebar__close" aria-label="Close sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar__body">
      <button id="new-chat-btn" class="btn btn--new-chat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        New Chat
      </button>

      <div class="sidebar__section">
        <p class="sidebar__section-title">Settings</p>

        <div class="api-key-section">
          <label for="api-key-input" class="api-key-section__label">Groq API Key</label>
          <div class="api-key-section__row">
            <input
              type="password"
              id="api-key-input"
              class="api-key-section__input"
              placeholder="gsk_..."
              autocomplete="off"
            />
          </div>
          <div class="api-key-section__actions">
            <button id="save-key-btn" class="btn btn--primary btn--full">Save Key</button>
          </div>
          <p id="api-key-status" class="api-key-section__status"></p>
        </div>

        <div class="api-key-section">
          <label for="hf-api-key-input" class="api-key-section__label">Hugging Face API Key</label>
          <div class="api-key-section__row">
            <input
              type="password"
              id="hf-api-key-input"
              class="api-key-section__input"
              placeholder="hf_..."
              autocomplete="off"
            />
          </div>
          <div class="api-key-section__actions">
            <button id="save-hf-key-btn" class="btn btn--primary btn--full">Save Key</button>
          </div>
          <p id="hf-api-key-status" class="api-key-section__status"></p>
        </div>

        <div class="mode-section">
          <p class="sidebar__section-title">Mode</p>
          <div class="mode-toggle" role="group" aria-label="Select mode">
            <button id="mode-chat-btn" class="btn mode-toggle__btn mode-toggle__btn--active" data-mode="chat">
              💬 Chat
            </button>
            <button id="mode-image-btn" class="btn mode-toggle__btn" data-mode="image">
              🖼 Image Gen
            </button>
          </div>
          <p id="mode-status" class="api-key-section__status"></p>
        </div>
      </div>
    </div>

    <div class="sidebar__footer">
      <p class="sidebar__footer-text">Groq · llama-3.1-8b-instant · FLUX.2-klein-9B</p>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <header class="topbar">
      <button id="sidebar-toggle" class="topbar__menu-btn" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <span class="topbar__title">Interlude AI</span>
      <div class="topbar__spacer"></div>
    </header>

    <div id="chat-window" class="chat-window" aria-live="polite" aria-label="Chat messages"></div>

    <div class="input-area">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <textarea
          id="message-input"
          class="chat-form__input"
          placeholder="Message Interlude AI…"
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button type="submit" id="send-btn" class="btn btn--send" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
      <p class="input-area__hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
