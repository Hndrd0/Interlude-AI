<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interlude AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Mobile overlay -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar__header">
      <div class="sidebar__logo">
        <span class="sidebar__logo-icon">✦</span>
        <span class="sidebar__logo-text">Interlude AI</span>
      </div>
      <button id="sidebar-close" class="sidebar__close" aria-label="Close sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar__body">
      <button id="new-chat-btn" class="btn btn--new-chat">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        New Chat
      </button>
    </div>

    <div class="sidebar__footer">
      <p class="sidebar__footer-text">Powered by Groq · llama-3.1-8b-instant</p>
    </div>
  </aside>

  <!-- Settings Modal -->
  <div id="settings-overlay" class="settings-overlay" aria-hidden="true">
    <div class="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="settings-modal__header">
        <h2 id="settings-title" class="settings-modal__title">Settings</h2>
        <button id="settings-close" class="settings-modal__close" aria-label="Close settings">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <div class="settings-modal__body">
        <!-- Theme -->
        <div class="settings-section">
          <p class="settings-section__title">Appearance</p>
          <div class="settings-row">
            <span class="settings-row__label">Theme</span>
            <div class="theme-toggle">
              <span class="theme-toggle__label">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                Dark
              </span>
              <label class="toggle-switch" aria-label="Toggle light mode">
                <input type="checkbox" id="theme-toggle-input" />
                <span class="toggle-switch__track"></span>
              </label>
              <span class="theme-toggle__label">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14">
                  <circle cx="12" cy="12" r="5"/>
                  <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                Light
              </span>
            </div>
          </div>
        </div>

        <!-- Groq API Key -->
        <div class="settings-section">
          <p class="settings-section__title">Groq API</p>
          <div class="api-key-section">
            <label for="api-key-input" class="api-key-section__label">API Key</label>
            <input
              type="password"
              id="api-key-input"
              class="api-key-section__input"
              placeholder="gsk_..."
              autocomplete="off"
            />
            <div class="api-key-section__actions">
              <button id="save-key-btn" class="btn btn--primary btn--full">Save Groq Key</button>
            </div>
            <p id="api-key-status" class="api-key-section__status"></p>
          </div>
        </div>

        <!-- HuggingFace API Key -->
        <div class="settings-section">
          <p class="settings-section__title">Hugging Face API</p>
          <div class="api-key-section">
            <label for="hf-api-key-input" class="api-key-section__label">API Key</label>
            <input
              type="password"
              id="hf-api-key-input"
              class="api-key-section__input"
              placeholder="hf_..."
              autocomplete="off"
            />
            <div class="api-key-section__actions">
              <button id="save-hf-key-btn" class="btn btn--primary btn--full">Save HF Key</button>
            </div>
            <p id="hf-api-key-status" class="api-key-section__status"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main content -->
  <main class="main">
    <header class="topbar">
      <button id="sidebar-toggle" class="topbar__menu-btn" aria-label="Toggle sidebar">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>
      <span class="topbar__title">Interlude AI</span>
      <div class="topbar__spacer"></div>
      <button id="settings-btn" class="topbar__icon-btn" aria-label="Open settings">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
          <path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a6.97 6.97 0 0 0-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.476.476 0 0 0 .12.61l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.37 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.57 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
        </svg>
      </button>
    </header>

    <div id="chat-window" class="chat-window" aria-live="polite" aria-label="Chat messages"></div>

    <div class="input-area">
      <form id="chat-form" class="chat-form" autocomplete="off">
        <button type="button" id="image-mode-btn" class="btn btn--mode" aria-label="Toggle image generation mode" title="Generate image">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
          </svg>
        </button>
        <textarea
          id="message-input"
          class="chat-form__input"
          placeholder="Message Interlude AI…"
          rows="1"
          aria-label="Message input"
        ></textarea>
        <button type="submit" id="send-btn" class="btn btn--send" aria-label="Send message">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </form>
      <p class="input-area__hint" id="input-hint">Press <kbd>Enter</kbd> to send · <kbd>Shift+Enter</kbd> for new line</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
