<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interlude AI</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Vendor libraries are bundled locally to avoid CDN dependency and SRI risks -->
  <!-- marked.js: lightweight Markdown-to-HTML renderer (no API keys exposed here) -->
  <script src="vendor/marked.min.js"></script>
  <!-- highlight.js: syntax highlighting inside code blocks -->
  <link rel="stylesheet" href="vendor/github-dark.min.css" />
  <script src="vendor/highlight.min.js"></script>
  <!-- Appwrite Web SDK (authentication, database) -->
  <script src="vendor/appwrite-sdk.min.js"></script>
</head>
<body>
  <!-- ============================================================
       AUTH SCREEN – shown when the user is not logged in
       ============================================================ -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <h1 class="brand">Interlude <span class="accent">AI</span></h1>
      <p class="brand-sub">Your intelligent conversation companion</p>

      <!-- Tab switcher -->
      <div class="auth-tabs" role="tablist">
        <button class="tab-btn active" role="tab" data-tab="login">Sign In</button>
        <button class="tab-btn" role="tab" data-tab="register">Sign Up</button>
      </div>

      <!-- Login form -->
      <form id="login-form" class="auth-form" novalidate>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required />

        <label for="login-password">Password</label>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />

        <button type="submit" class="btn-primary">Sign In</button>
        <p id="login-error" class="auth-error" aria-live="polite"></p>
      </form>

      <!-- Registration form (hidden by default) -->
      <form id="register-form" class="auth-form hidden" novalidate>
        <label for="reg-name">Name</label>
        <input id="reg-name" type="text" placeholder="Your name" autocomplete="name" required />

        <label for="reg-email">Email</label>
        <input id="reg-email" type="email" placeholder="you@example.com" autocomplete="email" required />

        <label for="reg-password">Password</label>
        <input id="reg-password" type="password" placeholder="Min. 8 characters" autocomplete="new-password" required minlength="8" />

        <button type="submit" class="btn-primary">Create Account</button>
        <p id="register-error" class="auth-error" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <!-- ============================================================
       MAIN APP – shown once the user is authenticated
       ============================================================ -->
  <div id="app" class="app hidden">

    <!-- ---- Sidebar ---- -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="brand sidebar-brand">Interlude <span class="accent">AI</span></span>
        <button id="new-chat-btn" class="icon-btn" title="New chat" aria-label="New chat">
          <!-- pencil / compose icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M12 20h9"/>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
          </svg>
        </button>
      </div>

      <!-- Chat list -->
      <nav id="chat-list" class="chat-list" aria-label="Conversations"></nav>

      <!-- User controls at bottom -->
      <div class="sidebar-footer">
        <span id="user-email" class="user-email"></span>
        <button id="logout-btn" class="icon-btn" title="Sign out" aria-label="Sign out">
          <!-- logout icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
               stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- ---- Mobile sidebar toggle ---- -->
    <button id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
           stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <!-- ---- Main chat area ---- -->
    <main class="chat-area">
      <!-- Empty state shown when no chat is active -->
      <div id="empty-state" class="empty-state">
        <h2>Welcome to Interlude <span class="accent">AI</span></h2>
        <p>Start a new conversation or select an existing one.</p>
        <button id="start-chat-btn" class="btn-primary">New Conversation</button>
      </div>

      <!-- Message list – populated dynamically -->
      <div id="messages" class="messages hidden" role="log" aria-live="polite" aria-label="Chat messages"></div>

      <!-- Input bar at the bottom -->
      <form id="chat-form" class="input-bar" novalidate>
        <textarea
          id="message-input"
          class="message-input"
          placeholder="Message Interlude AI…"
          rows="1"
          aria-label="Message input"
          maxlength="4000"
        ></textarea>
        <button id="send-btn" type="submit" class="send-btn" aria-label="Send message" disabled>
          <!-- send / arrow-up icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
               stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
          </svg>
        </button>
      </form>
    </main>
  </div>

  <!-- Main application logic -->
  <script src="app.js"></script>
</body>
</html>
