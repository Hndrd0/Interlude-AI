<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interlude AI</title>

    <!-- Google Fonts: Recoleta-like (e.g., EB Garamond for serif, Inter for sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Highlight.js CSS for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.0"></script>

    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- DOMPurify for HTML sanitization -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>

    <!-- Highlight.js for Code Highlighting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="dark-theme">
    <div id="app-container">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <button id="new-chat-btn" class="nav-btn new-chat-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    <span>New Chat</span>
                </button>
            </div>

            <div class="sidebar-middle">
                <h3 class="sidebar-section-title">Recent</h3>
                <ul id="chat-list" class="chat-list">
                    <!-- Chat items will be injected here -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <ul class="nav-list">
                    <li>
                        <button class="nav-btn" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
                            <span>Projects</span>
                        </button>
                    </li>
                    <li>
                        <button class="nav-btn" id="open-artifacts-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            <span>Artifacts</span>
                        </button>
                    </li>
                    <li>
                        <button class="nav-btn" disabled>
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                            <span>Code</span>
                        </button>
                    </li>
                    <li>
                        <button id="open-settings-btn" class="nav-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                            <span>Customize</span>
                        </button>
                    </li>
                </ul>
                <div class="user-profile">
                    <div class="user-avatar">H</div>
                </div>
            </div>
        </nav>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content">
            <!-- Topbar for mobile and sidebar toggle -->
            <header class="topbar">
                <button id="sidebar-toggle" class="icon-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <div class="topbar-title">Interlude AI</div>
            </header>

            <div id="chat-scroll-container" class="chat-scroll-container">
                <!-- Empty State (Welcome Screen) -->
                <div id="empty-state" class="empty-state">
                    <h1 class="greeting">
                        <span class="greeting-icon">✸</span>
                        <span id="greeting-text">Good evening, User</span>
                    </h1>
                </div>

                <!-- Chat Messages Area -->
                <div id="chat-messages" class="chat-messages" style="display: none;">
                    <!-- Message bubbles will be injected here -->
                </div>
            </div>

            <!-- Composer Area -->
            <div class="composer-container">
                <div class="composer">
                    <div class="composer-inner">
                        <textarea id="message-input" placeholder="How can I help you today?" rows="1"></textarea>

                        <div class="composer-toolbar">
                            <button class="icon-btn attach-btn">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                            </button>

                            <div class="composer-toolbar-right">
                                <!-- Model Picker inside composer -->
                                <div class="model-picker-wrapper">
                                    <button id="model-picker-btn" class="model-picker-btn">
                                        <span id="current-model-name">Haiku 4.5</span>
                                        <span class="model-badge">Extended</span>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </button>
                                    <!-- Model Popup Menu -->
                                    <div id="model-popup" class="model-popup hidden">
                                        <div class="model-list">
                                            <!-- Model options injected by JS -->
                                        </div>
                                    </div>
                                </div>

                                <button class="icon-btn voice-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                                </button>

                                <button id="send-btn" class="icon-btn send-btn">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                </button>

                                <button id="stop-btn" class="icon-btn stop-btn hidden">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2" ry="2"></rect></svg>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Suggestions placed below the composer -->
                    <div id="suggestions-container" class="suggestions-container">
                        <button class="suggestion-btn">
                            <span class="suggestion-icon">&lt;/&gt;</span> Code
                        </button>
                        <button class="suggestion-btn">
                            <span class="suggestion-icon">🎓</span> Learn
                        </button>
                        <button class="suggestion-btn">
                            <span class="suggestion-icon">✨</span> Create
                        </button>
                        <button class="suggestion-btn">
                            <span class="suggestion-icon">📝</span> Write
                        </button>
                        <button class="suggestion-btn">
                            <span class="suggestion-icon">🔺</span> From Drive
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Settings Modal -->
        <div id="settings-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button id="close-settings-btn" class="icon-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>

                <div class="modal-body">
                    <div class="settings-sidebar">
                        <button class="settings-tab active" data-tab="appearance">Appearance</button>
                        <button class="settings-tab" data-tab="usage">Usage</button>
                        <button class="settings-tab" data-tab="promo">Promo Codes</button>
                        <button class="settings-tab" data-tab="data">Data Management</button>
                    </div>

                    <div class="settings-content">
                        <!-- Appearance Tab -->
                        <div id="tab-appearance" class="settings-panel active">
                            <h3>Theme</h3>
                            <div class="theme-options">
                                <label class="radio-label">
                                    <input type="radio" name="theme" value="dark" checked> Dark (Claude style)
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="theme" value="light"> Light
                                </label>
                            </div>
                        </div>

                        <!-- Usage Tab -->
                        <div id="tab-usage" class="settings-panel hidden">
                            <h3>Hourly Usage</h3>
                            <div class="usage-stats">
                                <div class="usage-text">
                                    <span id="tokens-used">0</span> / <span id="tokens-limit">100000</span>
                                </div>
                                <div class="progress-bar-container">
                                    <div id="usage-progress-bar" class="progress-bar" style="width: 0%"></div>
                                </div>
                                <div class="usage-details">
                                    <div>Remaining: <span id="tokens-remaining">100000</span></div>
                                    <div>Resets in: <span id="time-to-reset">--m</span></div>
                                </div>
                            </div>
                        </div>

                        <!-- Promo Tab -->
                        <div id="tab-promo" class="settings-panel hidden">
                            <h3>Activate Promo Code</h3>
                            <div class="promo-container">
                                <input type="text" id="promo-input" placeholder="Enter code here" class="text-input">
                                <button id="activate-promo-btn" class="primary-btn">Activate</button>
                            </div>
                            <div id="promo-status" class="status-message"></div>

                            <div id="admin-badge" class="admin-badge hidden">
                                ✓ Admin Access Enabled (Unlimited Usage)
                            </div>
                        </div>

                        <!-- Data Tab -->
                        <div id="tab-data" class="settings-panel hidden">
                            <h3>Data Management</h3>
                            <div class="data-actions">
                                <button id="export-chats-btn" class="secondary-btn">Export Chats</button>
                                <button id="import-chats-btn" class="secondary-btn">Import Chats</button>
                                <input type="file" id="import-file-input" style="display: none;" accept=".json">
                                <button id="delete-all-chats-btn" class="danger-btn">Delete All Chats</button>
                                <button id="clear-cache-btn" class="danger-btn">Clear Cache</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Artifacts Panel -->
        <div id="artifacts-panel" class="artifacts-panel">
            <div class="resize-handle"></div>
            <div class="artifacts-header">
                <div class="artifacts-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                    <span id="artifact-filename">untitled.html</span>
                </div>
                <div class="artifacts-actions">
                    <button class="icon-btn small" title="Preview" id="artifact-preview-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    </button>
                    <button class="icon-btn small" title="Copy" id="artifact-copy-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <button class="icon-btn small" title="Download" id="artifact-download-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    </button>
                    <button class="icon-btn small" id="close-artifacts-btn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            <div class="artifacts-content">
                <pre id="artifact-code-view" class="artifact-code-view"><code id="artifact-code-container"></code></pre>
                <iframe id="artifact-preview-frame" class="artifact-preview-frame hidden" sandbox="allow-scripts"></iframe>
            </div>
        </div>
    </div>

    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
